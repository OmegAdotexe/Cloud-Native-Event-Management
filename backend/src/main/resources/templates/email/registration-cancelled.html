<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8"/>
    <title th:text="${title}">Registration Cancelled</title>
    <style>
        body { margin:0; padding:0; background:#f4f5f7; font-family:'Segoe UI',Arial,sans-serif; }
        .wrap { max-width:560px; margin:40px auto; background:#fff; border-radius:12px; overflow:hidden; box-shadow:0 2px 8px rgba(0,0,0,.06); }
        .header { background:linear-gradient(135deg,#E55A4F,#C44035); padding:28px 32px; }
        .header h1 { margin:0; color:#fff; font-size:20px; font-weight:700; }
        .body { padding:28px 32px; color:#2d3748; font-size:15px; line-height:1.6; }
        .badge { display:inline-block; padding:4px 14px; border-radius:20px; font-size:12px; font-weight:600; background:#FDE8E7; color:#C44035; }
        .footer { padding:20px 32px; background:#f9fafb; color:#8b90a5; font-size:12px; text-align:center; }
    </style>
</head>
<body>
<div class="wrap">
    <div class="header">
        <h1>❌ Registration Cancelled</h1>
    </div>
    <div class="body">
        <p>Hi there,</p>
        <p th:text="${message}">Your registration has been cancelled.</p>
        <p><span class="badge">CANCELLED</span></p>
        <p>If you believe this was a mistake, please reach out to the event organizer.</p>
    </div>
    <div class="footer">
        CampusConnect &middot; Cloud-Native Event Management
    </div>
</div>
</body>
</html>
