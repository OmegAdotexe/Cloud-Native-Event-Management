spring:
  datasource:
    url: jdbc:h2:mem:campusconnect;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    driver-class-name: org.h2.Driver
    username: sa
    password: password
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
  rabbitmq:
    listener:
      simple:
        auto-startup: false
  mail:
    host: localhost
    port: 1025

app:
  email:
    enabled: false

