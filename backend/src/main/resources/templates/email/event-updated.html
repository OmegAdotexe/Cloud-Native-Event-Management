<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8"/>
    <title th:text="${title}">Event Details Updated</title>
    <style>
        body { margin:0; padding:0; background:#f4f5f7; font-family:'Segoe UI',Arial,sans-serif; }
        .wrap { max-width:560px; margin:40px auto; background:#fff; border-radius:12px; overflow:hidden; box-shadow:0 2px 8px rgba(0,0,0,.06); }
        .header { background:linear-gradient(135deg,#3B82F6,#1D4ED8); padding:28px 32px; }
        .header h1 { margin:0; color:#fff; font-size:20px; font-weight:700; }
        .body { padding:28px 32px; color:#2d3748; font-size:15px; line-height:1.6; }
        .badge { display:inline-block; padding:4px 14px; border-radius:20px; font-size:12px; font-weight:600; background:#DBEAFE; color:#1D4ED8; }
        .footer { padding:20px 32px; background:#f9fafb; color:#8b90a5; font-size:12px; text-align:center; }
    </style>
</head>
<body>
<div class="wrap">
    <div class="header">
        <h1>📣 Event Details Updated</h1>
    </div>
    <div class="body">
        <p>Hi there,</p>
        <p th:text="${message}">The organizer has updated details for an event you are registered for.</p>
        <p><span class="badge">SCHEDULE / VENUE UPDATE</span></p>
        <p>Please check your CampusConnect portal for the latest event location, virtual links, and timeline.</p>
    </div>
    <div class="footer">
        CampusConnect &middot; University Event Management Platform
    </div>
</div>
</body>
</html>
