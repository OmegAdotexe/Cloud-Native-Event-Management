<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8"/>
    <title th:text="${title}">Event Reminder</title>
    <style>
        body { margin:0; padding:0; background:#f4f5f7; font-family:'Segoe UI',Arial,sans-serif; }
        .wrap { max-width:560px; margin:40px auto; background:#fff; border-radius:12px; overflow:hidden; box-shadow:0 2px 8px rgba(0,0,0,.06); }
        .header { background:linear-gradient(135deg,#F59E0B,#D97706); padding:28px 32px; }
        .header h1 { margin:0; color:#fff; font-size:20px; font-weight:700; }
        .body { padding:28px 32px; color:#2d3748; font-size:15px; line-height:1.6; }
        .badge { display:inline-block; padding:4px 14px; border-radius:20px; font-size:12px; font-weight:600; background:#FEF3C7; color:#B45309; }
        .footer { padding:20px 32px; background:#f9fafb; color:#8b90a5; font-size:12px; text-align:center; }
    </style>
</head>
<body>
<div class="wrap">
    <div class="header">
        <h1>⏰ Upcoming Event Reminder</h1>
    </div>
    <div class="body">
        <p>Hi there,</p>
        <p th:text="${message}">This is a reminder that an event you registered for is happening soon!</p>
        <p><span class="badge">STARTING SOON</span></p>
        <p>Be sure to arrive on time and have your digital entry pass ready in your CampusConnect account.</p>
    </div>
    <div class="footer">
        CampusConnect &middot; University Event Management Platform
    </div>
</div>
</body>
</html>
